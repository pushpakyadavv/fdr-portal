<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; frame-ancestors 'none';">
<title>Instruments — FDR Portal</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="main">
  <header class="topbar" id="topbar"></header>
  <section class="content">
    <h2>FDR Instruments</h2>
    <div class="filter-bar">
      <input id="f-q" type="search" placeholder="Search ref / bank / institution">
      <select id="f-state">
        <option value="">All Trust States</option>
        <option value="bank_verified">Bank-Confirmed</option>
        <option value="doc_verified">Doc-Verified</option>
        <option value="claimed">Claimed</option>
        <option value="mismatch">Mismatch</option>
      </select>
      <select id="f-status">
        <option value="">All Statuses</option>
        <option value="active">Active</option>
        <option value="matured">Matured</option>
        <option value="renewed">Renewed</option>
        <option value="released">Released</option>
      </select>
      <select id="f-region">
        <option value="">All Regions</option>
        <option>North</option><option>South</option><option>East</option><option>West</option><option>Central</option>
      </select>
      <button class="btn btn-primary" id="export-csv">Export CSV</button>
    </div>
    <p class="muted" id="count"></p>
    <div id="instruments-table"></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/trust.js"></script>
<script src="js/page-instruments.js"></script>
<script src="js/lang.js"></script>
</body>
</html>
