<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; frame-ancestors 'none';">
<title>Instrument — FDR Portal</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="main">
  <header class="topbar" id="topbar"></header>
  <section class="content">
    <div id="detail"></div>
    <div id="actions" class="action-row"></div>
    <h3>Coverage Timeline (this institution)</h3>
    <div id="timeline"></div>

    <h3>Documents</h3>
    <div id="docs"></div>
    <form id="upload-form" class="upload-form" style="display:none">
      <select id="doc-type">
        <option value="fdr_scan">FDR Scan</option>
        <option value="deposit_confirmation">Deposit Confirmation</option>
        <option value="renewal_proof">Renewal Proof</option>
      </select>
      <input type="file" id="doc-file" accept=".pdf,.jpg,.jpeg,.png">
      <button class="btn btn-primary" type="submit">Upload</button>
    </form>

    <h3>Verification History</h3>
    <div id="verify-history"></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/trust.js"></script>
<script src="js/coverage.js"></script>
<script src="js/verify.js"></script>
<script src="js/audit.js"></script>
<script src="js/upload-guard.js"></script>
<script src="js/page-detail.js"></script>
<script src="js/lang.js"></script>
</body>
</html>
